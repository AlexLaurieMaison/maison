<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Maison</title>
<style>
:root{
  --bg:#0E0F13;--card:#181A21;--card2:#20232C;--line:#2A2D37;
  --txt:#FFFFFF;--grey:#A0A4AE;--dim:#6B7080;--gold:#E9B949;--gold-soft:rgba(233,185,73,.14);--red:#FF6B6B;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(66px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + var(--safe-t)) 12px 6px;display:flex;align-items:center;gap:12px}
header .t{flex:1}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header .sub{color:var(--gold);font-size:12px;font-weight:700;margin-top:2px}
.icon-btn{width:36px;height:36px;border-radius:18px;background:var(--card);color:var(--grey);font-size:19px;display:grid;place-items:center}
.icon-btn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:0 10px}
.page{display:none}.page.on{display:block}
.group{margin:8px 0 0}
.group h2{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:0 4px 4px;display:flex;gap:8px;align-items:center}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 12px;min-height:44px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{flex:1;font-size:15px;line-height:1.2}
.row .meta{display:block;font-size:11px;color:var(--dim);margin-top:1px}
.buy{width:34px;height:34px;border-radius:17px;border:2px solid var(--gold);color:var(--gold);font-size:16px;font-weight:800;display:grid;place-items:center;flex:none}
.buy:active{background:var(--gold);color:var(--bg)}
.pill{flex:none;padding:5px 10px;border-radius:16px;font-size:12px;font-weight:800;background:var(--card2);color:var(--dim);min-width:74px;text-align:center}
.pill.on{background:var(--gold);color:var(--bg)}
.edit{flex:none;width:28px;height:28px;border-radius:14px;color:var(--dim);font-size:14px}
.empty{text-align:center;color:var(--grey);padding:60px 20px;font-size:17px;line-height:1.5}
.empty b{display:block;font-size:44px;margin-bottom:10px}
.cats{position:sticky;top:calc(52px + var(--safe-t));z-index:4;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:2px 10px 6px;margin:0 -10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .chip{flex:none;white-space:nowrap}
.cats .chip small{opacity:.7;margin-left:4px;font-weight:800}
.search{padding:2px 0 4px}
.tools{display:flex;gap:8px;margin-top:6px}
.tools button{flex:1;padding:9px;border-radius:12px;background:var(--card);color:var(--grey);font-weight:700;font-size:14px}
textarea{width:100%;min-height:150px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;color:var(--txt);font:inherit;font-size:16px;padding:14px;outline:none;margin-bottom:12px;resize:vertical}
textarea:focus{border-color:var(--gold)}
.switch{display:flex;align-items:center;gap:10px;margin:4px 0 6px;color:var(--grey);font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--gold);margin:0}
.search input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--txt);font-size:16px;padding:10px 12px;outline:none}
.search input:focus{border-color:var(--gold)}
.addcard{margin-top:12px;background:var(--gold-soft);border:1.5px solid rgba(233,185,73,.5);border-radius:18px;padding:14px}
.addcard .ttl{font-weight:800;font-size:17px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 11px;border-radius:16px;background:var(--card2);color:var(--grey);font-weight:700;font-size:13px}
.chip.on{background:var(--gold);color:var(--bg)}
.big{display:block;width:100%;margin-top:12px;padding:15px;border-radius:16px;background:var(--gold);color:var(--bg);font-weight:800;font-size:17px}
.big.ghost{background:var(--card2);color:var(--txt)}
.big.danger{background:none;color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(14,15,19,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:5px 10px calc(5px + var(--safe-b))}
nav button{flex:1;padding:5px 4px;border-radius:12px;color:var(--dim);font-weight:700;font-size:12px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:6px}
nav button .ic{font-size:18px}
nav button.on{color:var(--gold);background:var(--gold-soft)}
nav .badge{background:var(--gold);color:var(--bg);border-radius:10px;padding:0 7px;font-size:11px;margin-left:4px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + var(--safe-b));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet p{color:var(--grey);margin:0 0 14px;line-height:1.45;font-size:15px}
.sheet input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;color:var(--txt);font-size:17px;padding:14px;outline:none;margin-bottom:12px}
.sheet input:focus{border-color:var(--gold)}
.lbl{font-size:13px;color:var(--dim);font-weight:700;margin:6px 0 8px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(64px + var(--safe-b));z-index:30;background:#2B2E38;color:var(--txt);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(150%);opacity:0;transition:.25s;pointer-events:none}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast span{flex:1}
.toast button{color:var(--gold);font-weight:800;padding:4px 6px}
.status{font-size:11px;color:var(--dim);text-align:center;margin:10px 0 4px}
.status.err{color:var(--red)}
</style>
</head>
<body>
<header>
  <div class="t">
    <h1 id="title">À acheter</h1>
    <div class="sub" id="sub"></div>
  </div>
  <button class="icon-btn" id="refresh" aria-label="Actualiser">↻</button>
  <button class="icon-btn" id="settings" aria-label="Réglages">⚙</button>
</header>

<main>
  <div class="cats" id="cats"></div>
  <section class="page on" id="p-buy"></section>
  <section class="page" id="p-all">
    <div class="search"><input id="q" placeholder="Chercher ou ajouter un produit…" autocomplete="off" enterkeyhint="done"></div>
    <div id="addzone"></div>
    <div class="tools" id="tools"><button id="bulkBtn">＋ Ajouter plusieurs produits</button></div>
    <div id="allList"></div>
  </section>
  <div class="status" id="status"></div>
</main>

<nav>
  <button class="on" data-p="buy"><span class="ic">🛒</span><span>À acheter<span class="badge" id="badge"></span></span></button>
  <button data-p="all"><span class="ic">📋</span><span>Produits</span></button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">Annuler</button></div>

<script>
// ====== Lien du script Google (rempli à la mise en ligne) ======
var API_DEFAULT = 'https://script.google.com/macros/s/AKfycbx5MqIS4bG9EjIqulXC3D7qMQPxR-VlPSc82Mjxe89l_IJzbWNsSNd0XfMvhgYCtGJGXQ/exec';
// ===============================================================

var CATS = [
  ['Fruits & légumes','🥦'],['Frais','🧀'],['Viande & poisson','🍗'],['Épicerie','🍝'],
  ['Boissons','🥤'],['Surgelés','❄️'],['Hygiène','🧴'],['Maison','🧽'],['Autre','📦']
];
var EMO = {}; CATS.forEach(function(c){ EMO[c[0]] = c[1]; });

var DEMO = location.search.indexOf('demo') >= 0;
var state = { products: load('products', []), pending: load('pending', []), who: load('who', ''), api: load('api', '') || API_DEFAULT, page: 'buy', cat: load('cat', 'all') };
if (state.api.indexOf('AKfycbwF4Qw') >= 0) { state.api = API_DEFAULT; save('api', ''); state.products = []; }
var params = new URLSearchParams(location.search);
if (params.get('api')) { state.api = params.get('api'); save('api', state.api); }

function load(k, d){ try { var v = localStorage.getItem('maison_' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem('maison_' + k, JSON.stringify(v)); } catch(e){} }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2, 10); }

// ---------- Synchro ----------
var busy = false, lastErr = '';
function call(params){
  if (DEMO) return Promise.resolve({ ok: true, products: state.products });
  var url = state.api + (state.api.indexOf('?') >= 0 ? '&' : '?') + new URLSearchParams(params).toString() + '&t=' + Date.now();
  return fetch(url, { redirect: 'follow' }).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error || 'Erreur du script');
    return j;
  });
}
function applyPending(list){
  state.pending.forEach(function(op){
    if (op.action === 'set') list.forEach(function(p){ if (p.id === op.id) p.missing = op.missing === '1'; });
    else if (op.action === 'add' && !list.some(function(p){ return p.name.toLowerCase() === op.name.toLowerCase(); }))
      list.push({ id: op.id, name: op.name, cat: op.cat, missing: op.missing !== '0', by: op.by, at: Date.now() });
    else if (op.action === 'del') list = list.filter(function(p){ return p.id !== op.id; });
    else if (op.action === 'edit') list.forEach(function(p){ if (p.id === op.id){ p.name = op.name; p.cat = op.cat; } });
  });
  return list;
}
function sync(){
  if (!state.api && !DEMO) { render(); return; }
  if (busy) return;
  busy = true; $('refresh').classList.add('spin');
  var next = function(){
    if (state.pending.length) {
      return call(state.pending[0]).then(function(j){
        state.pending.shift(); save('pending', state.pending);
        if (!state.pending.length) { state.products = j.products; }
        return next();
      });
    }
    return call({ action: 'list' }).then(function(j){ state.products = applyPending(j.products); });
  };
  next().then(function(){ lastErr = ''; save('products', state.products); save('synced', Date.now()); state.okOnce = true; })
    .catch(function(e){
      var m = e.message || 'Synchro impossible';
      if (m.indexOf('getSheetByName') >= 0 || m.indexOf('feuille') >= 0) m = 'Le script doit être créé depuis la feuille Google (Extensions → Apps Script).';
      lastErr = navigator.onLine ? m : 'Hors connexion : les changements seront envoyés plus tard';
    })
    .then(function(){ busy = false; $('refresh').classList.remove('spin'); render(); if (state.okOnce && !lastErr) cleanDefaults(); });
}
var DEFAULTS = ['Bananes','Pommes','Citrons','Tomates','Salade','Oignons','Pommes de terre','Carottes','Lait','Œufs','Beurre','Yaourts',
  'Fromage râpé','Crème fraîche','Jambon','Poulet','Steaks hachés','Saumon','Pain','Pâtes','Riz','Farine','Sucre',"Huile d'olive",'Café',
  'Céréales','Sauce tomate','Sel','Poivre','Eau',"Jus d'orange",'Légumes surgelés','Glaces','Papier toilette','Gel douche','Dentifrice',
  'Shampoing','Mouchoirs','Liquide vaisselle','Lessive','Éponges','Sacs poubelle','Essuie-tout'];
/** Retire une fois les produits de base ajoutés au départ (ceux que personne n'a touchés). */
function cleanDefaults(){
  if (DEMO || load('cleaned', false)) return;
  save('cleaned', true);
  var dels = state.products.filter(function(p){ return DEFAULTS.indexOf(p.name) >= 0 && !p.by && !p.missing; })
    .map(function(p){ return { action: 'del', id: p.id }; });
  if (dels.length) opsBatch(dels);
}
function op(o){
  o.by = state.who;
  state.pending.push(o); save('pending', state.pending);
  state.products = applyPending(state.products.slice().map(function(p){ return Object.assign({}, p); }));
  // applyPending rejoue tout : on retire les doublons d'ajout éventuels
  save('products', state.products);
  render();
  sync();
}

// ---------- Rendu ----------
function grouped(list){
  var g = {};
  list.forEach(function(p){ (g[p.cat] = g[p.cat] || []).push(p); });
  var order = CATS.map(function(c){ return c[0]; });
  return Object.keys(g).sort(function(a, b){
    var ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  }).map(function(k){ return [k, g[k].sort(function(a, b){ return a.name.localeCompare(b.name, 'fr'); })]; });
}
function inCat(p){ return state.cat === 'all' || p.cat === state.cat || (state.cat === 'Autre' && !EMO[p.cat]); }
function renderCats(){
  var base = state.page === 'buy' ? state.products.filter(function(p){ return p.missing; }) : state.products;
  var counts = {}; base.forEach(function(p){ var c = EMO[p.cat] ? p.cat : 'Autre'; counts[c] = (counts[c] || 0) + 1; });
  var html = '<button class="chip' + (state.cat === 'all' ? ' on' : '') + '" data-cat="all">Tout<small>' + base.length + '</small></button>';
  CATS.forEach(function(c){
    if (state.page === 'buy' && !counts[c[0]] && state.cat !== c[0]) return;
    html += '<button class="chip' + (state.cat === c[0] ? ' on' : '') + '" data-cat="' + esc(c[0]) + '">' + c[1] + ' ' + c[0] + (counts[c[0]] ? '<small>' + counts[c[0]] + '</small>' : '') + '</button>';
  });
  $('cats').innerHTML = html;
}
function render(){
  var allMissing = state.products.filter(function(p){ return p.missing; });
  var missing = allMissing.filter(inCat);
  $('badge').textContent = allMissing.length ? allMissing.length : '';
  $('badge').style.display = allMissing.length ? '' : 'none';
  $('title').textContent = state.page === 'buy' ? 'À acheter' : 'Produits';
  $('sub').textContent = state.page === 'buy'
    ? (allMissing.length ? allMissing.length + ' produit' + (allMissing.length > 1 ? 's' : '') + ' manque' + (allMissing.length > 1 ? 'nt' : '') : 'Rien ne manque')
    : state.products.length + ' produits · touche ce qui manque';
  document.querySelectorAll('nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.p === state.page); });
  $('p-buy').classList.toggle('on', state.page === 'buy');
  $('p-all').classList.toggle('on', state.page === 'all');

  if (!state.api && !DEMO) {
    $('p-buy').innerHTML = '<div class="empty"><b>🔗</b>Il manque le lien de la liste.<br>Touche ⚙ pour le coller.</div>';
    $('allList').innerHTML = ''; $('status').textContent = ''; return;
  }

  renderCats();
  // Page « À acheter »
  if (!missing.length && allMissing.length) {
    $('p-buy').innerHTML = '<div class="empty"><b>✓</b>Rien ne manque dans ce rayon.</div>';
  } else if (!missing.length) {
    $('p-buy').innerHTML = '<div class="empty"><b>🎉</b>Rien ne manque pour l\'instant.<br><span style="color:var(--dim);font-size:15px">Ajoute ce qui manque depuis « Produits ».</span></div>';
  } else {
    $('p-buy').innerHTML = grouped(missing).map(function(g){
      return '<div class="group"><h2>' + (EMO[g[0]] || '📦') + ' ' + esc(g[0]) + '</h2><div class="card">' + g[1].map(function(p){
        return '<div class="row"><div class="name">' + esc(p.name) + (p.by ? '<span class="meta">ajouté par ' + esc(p.by) + '</span>' : '') +
          '</div><button class="buy" data-buy="' + esc(p.id) + '" aria-label="Acheté">✓</button></div>';
      }).join('') + '</div></div>';
    }).join('');
  }
  renderAll();
  var synced = load('synced', 0);
  $('status').className = 'status' + (lastErr ? ' err' : '');
  $('status').textContent = lastErr || (synced ? 'À jour · ' + new Date(synced).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '');
}
function renderAll(){
  var q = $('q').value.trim().toLowerCase();
  var list = state.products.filter(function(p){ return (!q || p.name.toLowerCase().indexOf(q) >= 0) && (q || inCat(p)); });
  var exact = state.products.some(function(p){ return p.name.toLowerCase() === q; });
  $('addzone').innerHTML = q && !exact ? '<div class="addcard"><div class="ttl">＋ Ajouter « ' + esc($('q').value.trim()) + ' »</div>' +
    '<div class="lbl">Rayon</div><div class="chips">' + CATS.map(function(c, i){
      return '<button class="chip' + (i === addCat ? ' on' : '') + '" data-addcat="' + i + '">' + c[1] + ' ' + c[0] + '</button>';
    }).join('') + '</div><button class="big" id="addBtn">Ajouter à ce qui manque</button><button class="big ghost" id="addStock">Juste l\'ajouter aux produits</button></div>' : '';
  $('allList').innerHTML = list.length ? grouped(list).map(function(g){
    return '<div class="group"><h2>' + (EMO[g[0]] || '📦') + ' ' + esc(g[0]) + '</h2><div class="card">' + g[1].map(function(p){
      return '<div class="row" data-toggle="' + esc(p.id) + '"><div class="name">' + esc(p.name) + '</div>' +
        '<span class="pill' + (p.missing ? ' on' : '') + '">' + (p.missing ? '✓ Manque' : 'En stock') + '</span>' +
        '<button class="edit" data-edit="' + esc(p.id) + '" aria-label="Modifier">✎</button></div>';
    }).join('') + '</div></div>';
  }).join('') : (q ? '' : '<div class="empty"><b>📋</b>' + (state.cat === 'all' ? 'Aucun produit pour l\'instant.' : 'Aucun produit dans ce rayon.') + '<br>Tape un nom en haut pour l\'ajouter.</div>');
}
var addCat = 3;

// ---------- Actions ----------
function find(id){ return state.products.filter(function(p){ return p.id === id; })[0]; }
var undoFn = null, toastTimer = null;
function toast(msg, undo){
  $('toastTxt').textContent = msg; undoFn = undo || null;
  $('toastBtn').style.display = undo ? '' : 'none';
  $('toast').classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ $('toast').classList.remove('on'); }, 3500);
}
$('toastBtn').onclick = function(){ if (undoFn) undoFn(); $('toast').classList.remove('on'); };

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-buy],[data-toggle],[data-edit],[data-addcat],[data-cat],#addBtn,#addStock,#bulkBtn,nav button');
  if (!t) return;
  if (t.dataset.p) { state.page = t.dataset.p; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.cat) {
    state.cat = t.dataset.cat; save('cat', state.cat);
    var ci = CATS.map(function(c){ return c[0]; }).indexOf(state.cat);
    if (ci >= 0) addCat = ci;
    render(); return;
  }
  if (t.id === 'addStock') { addProduct(false); return; }
  if (t.id === 'bulkBtn') { bulkSheet(); return; }
  if (t.dataset.buy) {
    var p = find(t.dataset.buy); if (!p) return;
    op({ action: 'set', id: p.id, missing: '0' });
    toast(p.name + ' : acheté ✓', function(){ op({ action: 'set', id: p.id, missing: '1' }); });
    return;
  }
  if (t.dataset.edit) { e.stopPropagation(); editSheet(find(t.dataset.edit)); return; }
  if (t.dataset.toggle) {
    var x = find(t.dataset.toggle); if (!x) return;
    op({ action: 'set', id: x.id, missing: x.missing ? '0' : '1' });
    if (!x.missing) toast(x.name + ' ajouté à « À acheter »');
    return;
  }
  if (t.dataset.addcat) { addCat = +t.dataset.addcat; renderAll(); return; }
  if (t.id === 'addBtn') addProduct(true);
});
function addProduct(missing){
  if (missing === undefined) missing = true;
  var name = $('q').value.trim(); if (!name) return;
  name = name.charAt(0).toUpperCase() + name.slice(1);
  op({ action: 'add', id: uid(), name: name, cat: CATS[addCat][0], missing: missing ? '1' : '0' });
  $('q').value = ''; renderAll();
  toast(missing ? name + ' ajouté à « À acheter »' : name + ' ajouté aux produits');
}
function opsBatch(list){
  list.forEach(function(o){ o.by = state.who; state.pending.push(o); });
  save('pending', state.pending);
  state.products = applyPending(state.products.slice().map(function(p){ return Object.assign({}, p); }));
  save('products', state.products);
  render(); sync();
}
function bulkSheet(){
  var ci = addCat;
  openSheet('<h3>Ajouter plusieurs produits</h3><p>Un produit par ligne. Tu peux coller une liste depuis tes notes.</p>' +
    '<textarea id="bText" placeholder="Lait d\'avoine&#10;Croquettes chat&#10;Pain de mie"></textarea>' +
    '<div class="lbl">Rayon</div><div class="chips" id="bCats">' +
    CATS.map(function(c, i){ return '<button class="chip' + (i === ci ? ' on' : '') + '" data-i="' + i + '">' + c[1] + ' ' + c[0] + '</button>'; }).join('') +
    '</div><label class="switch"><input type="checkbox" id="bMiss"> Les mettre aussi dans « À acheter »</label>' +
    '<button class="big" id="bOk">Ajouter</button>');
  $('bCats').onclick = function(e){ var b = e.target.closest('.chip'); if (!b) return; ci = +b.dataset.i;
    [].forEach.call($('bCats').children, function(c, i){ c.classList.toggle('on', i === ci); }); };
  $('bOk').onclick = function(){
    var miss = $('bMiss').checked;
    var seen = {};
    var names = $('bText').value.split(/\n|,|;/).map(function(x){ return x.replace(/^[-•*\s]+/, '').trim(); })
      .filter(function(x){ var k = x.toLowerCase(); if (!x || seen[k]) return false; seen[k] = 1; return true; });
    if (!names.length) return;
    opsBatch(names.map(function(n){
      var ex = state.products.filter(function(p){ return p.name.toLowerCase() === n.toLowerCase(); })[0];
      if (ex) return { action: 'set', id: ex.id, missing: miss || ex.missing ? '1' : '0' };
      return { action: 'add', id: uid(), name: n.charAt(0).toUpperCase() + n.slice(1), cat: CATS[ci][0], missing: miss ? '1' : '0' };
    }));
    closeSheet();
    toast(names.length + ' produit' + (names.length > 1 ? 's' : '') + ' ajouté' + (names.length > 1 ? 's' : ''));
  };
}
$('q').addEventListener('input', renderAll);
$('q').addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var q = $('q').value.trim().toLowerCase();
  var ex = state.products.filter(function(p){ return p.name.toLowerCase() === q; })[0];
  if (ex) { if (!ex.missing) op({ action: 'set', id: ex.id, missing: '1' }); $('q').value = ''; renderAll(); toast(ex.name + ' ajouté à « À acheter »'); }
  else addProduct();
  $('q').blur();
});

// ---------- Fenêtres ----------
function openSheet(html){ $('sheet').innerHTML = html; $('sheetBg').classList.add('on'); }
function closeSheet(){ $('sheetBg').classList.remove('on'); }
$('sheetBg').addEventListener('click', function(e){ if (e.target === $('sheetBg') && state.who) closeSheet(); });

function editSheet(p){
  if (!p) return;
  var ci = Math.max(0, CATS.map(function(c){ return c[0]; }).indexOf(p.cat));
  openSheet('<h3>Modifier</h3><input id="eName" value="' + esc(p.name) + '"><div class="lbl">Rayon</div><div class="chips" id="eCats">' +
    CATS.map(function(c, i){ return '<button class="chip' + (i === ci ? ' on' : '') + '" data-i="' + i + '">' + c[1] + ' ' + c[0] + '</button>'; }).join('') +
    '</div><button class="big" id="eSave">Enregistrer</button><button class="big danger" id="eDel">Supprimer ce produit</button>');
  $('eCats').onclick = function(e){ var b = e.target.closest('.chip'); if (!b) return; ci = +b.dataset.i;
    [].forEach.call($('eCats').children, function(c, i){ c.classList.toggle('on', i === ci); }); };
  $('eSave').onclick = function(){ var n = $('eName').value.trim(); if (n) op({ action: 'edit', id: p.id, name: n, cat: CATS[ci][0] }); closeSheet(); };
  $('eDel').onclick = function(){ if (confirm('Supprimer « ' + p.name + ' » de la liste des produits ?')) { op({ action: 'del', id: p.id }); closeSheet(); } };
}

function whoSheet(){
  openSheet('<h3>Bienvenue 👋</h3><p>Comment tu t\'appelles ? Ton prénom s\'affichera à côté de ce que tu ajoutes.</p>' +
    '<input id="wName" placeholder="Ton prénom" value="' + esc(state.who) + '"><button class="big" id="wOk">C\'est parti</button>');
  $('wOk').onclick = function(){ var n = $('wName').value.trim(); if (!n) return; state.who = n; save('who', n); closeSheet(); render(); };
}

$('settings').onclick = function(){
  openSheet('<h3>Réglages</h3><div class="lbl">Ton prénom</div><input id="sName" value="' + esc(state.who) + '">' +
    '<div class="lbl">Lien de la liste (script Google)</div><input id="sApi" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(state.api) + '">' +
    '<button class="big" id="sOk">Enregistrer</button>' +
    '<button class="big ghost" id="sShare">Partager l\'appli</button>' );
  $('sOk').onclick = function(){
    state.who = $('sName').value.trim() || state.who; save('who', state.who);
    var a = $('sApi').value.trim(); if (a !== state.api) { state.api = a; save('api', a); state.products = []; }
    closeSheet(); sync();
  };
  $('sShare').onclick = function(){
    var url = location.origin + location.pathname + (state.api && state.api !== API_DEFAULT ? '?api=' + encodeURIComponent(state.api) : '');
    if (navigator.share) navigator.share({ title: 'Maison', text: 'Notre liste de courses', url: url }).catch(function(){});
    else { navigator.clipboard && navigator.clipboard.writeText(url); toast('Lien copié'); }
  };
};
$('refresh').onclick = sync;

// ---------- Démarrage ----------
if (DEMO && !state.products.length) {
  var demo = { 'Frais': ['Lait', 'Œufs', 'Beurre', 'Yaourts'], 'Fruits & légumes': ['Bananes', 'Tomates', 'Salade'], 'Épicerie': ['Pâtes', 'Café', 'Pain'], 'Maison': ['Lessive', 'Sacs poubelle'], 'Hygiène': ['Papier toilette'] };
  var miss = { 'Lait': 1, 'Œufs': 1, 'Bananes': 1, 'Café': 1, 'Lessive': 1 };
  Object.keys(demo).forEach(function(c){ demo[c].forEach(function(n){ state.products.push({ id: uid(), name: n, cat: c, missing: !!miss[n], by: miss[n] ? (n === 'Café' ? 'Alex' : 'Sarah') : '' }); }); });
  if (!state.who) state.who = 'Alex';
}
render();
if (!state.who) whoSheet();
sync();
setInterval(function(){ if (!document.hidden) sync(); }, 30000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) sync(); });
window.addEventListener('online', sync);
if ('serviceWorker' in navigator && !DEMO) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
